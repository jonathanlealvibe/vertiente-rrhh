# Cualquier ruta cae en index.html: la aplicación resuelve la navegación en el
# navegador. Evita un 404 si alguien recarga estando dentro de una vista.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
