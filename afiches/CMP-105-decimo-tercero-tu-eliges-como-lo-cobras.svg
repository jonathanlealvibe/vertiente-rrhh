  <text data-caja="pie-vigencia" data-ancho="730" x="56" y="1077" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#a9e4d3"><tspan x="56" dy="0">Vigencia: desde el 21 de septiembre de 2026 hasta el 24 de diciembre de 2026. Campaña CMP-105 · Toda la nómina · 1.200</tspan><tspan x="56" dy="15.25">colaboradores</tspan></text>
  <text data-caja="pie-contacto" data-ancho="730" x="56" y="1114.25" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#a9e4d3"><tspan x="56" dy="0">¿Dudas? Escribe a VERA por WhatsApp o a Jefatura de Nómina y Compensaciones: responde en 2 días hábiles.</tspan></text>
  <text data-caja="pie-nota" data-ancho="730" x="56" y="1136.25" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#a9e4d3" opacity="0.85"><tspan x="56" dy="0">Corporación Vertiente S.A. · Recursos Humanos · Esta pieza informa; no sustituye la norma ni reemplaza la consulta con tu jefatura.</tspan></text>
