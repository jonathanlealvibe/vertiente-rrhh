  <text data-caja="accion-etiqueta" data-ancho="614" x="172" y="870.56" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#ffc071" letter-spacing="1.5"><tspan x="172" dy="0">QUÉ HACER</tspan></text>
  <text data-caja="instruccion" data-ancho="614" x="172" y="908.56" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="25" font-weight="600" fill="#ffffff"><tspan x="172" dy="0">Si quieres cambiar de modalidad, avisa a</tspan><tspan x="172" dy="32">Nómina antes del 31 de octubre. Si no avisas,</tspan><tspan x="172" dy="32">se mantiene la modalidad que ya tienes.</tspan></text>
  <line x1="56" y1="1027" x2="786" y2="1027" stroke="#187767" stroke-width="2" stroke-linecap="square"/>
